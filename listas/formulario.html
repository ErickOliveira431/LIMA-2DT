<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <!-- formulario  -->
     <form>   <!--estrutura do formulario  -->
      <fieldset><!-- linha para mostra onde e o formulario nao obrigatorio -->
        <legend>informaçoes de contato</legend><!--nome ou legenda do formulario  -->
        <label for="nome">nome</label><!--indicaçao de entrada  -->
        <input type="text" id="nome" name="nome" placeholder="infome seu nome"><!-- campo de entrada -->
  
      
      

      <label for="e-mail">e-mail</label>
    <input type="email" id="e-mail" name="e-mail" placeholder="infome seu email">
    
    
    
    <label for="senaha">senha</label>
    <input type="password" id="senha" name="senha" placeholder="infomea a senha">

   <label for="data de nacimento">data de nacimento</label>
   <input type="date" name="data" id="data" required>
   

        </fieldset>
        
        <fieldset>
         <legend>preferencias</legend>
          <p>informe sua cor favorita</p>
          <label ><input type="radio" name="cor">azul</label><!-- para fazer botao de selecionar que nem prova -->
          <label><input type="dadio" name="cor">vermelho</label>
  
          <p>informe a fruta que vc quer </p>
          <!-- label>input  atalhod dos dois -->
           <label><input type="checkbox" name="fruta">maça</label><!--selecionar os dois  -->
            <label><input type="checkbox" name="fruta">uva</label>

            <label for="indioma">indioma</label>
            <select name="indioma" id="indioma">
                <option value="" disabled>selecione uma opçao</option>
                <option value="pt">português</option>
                <option value="en">ingles</option>
            </select>
           
            <label for="sugestoes">sugestoea</label>
            <textarea name="sugestoes" id="sugestoes"></textarea>       
       
        </fieldset>  
   <button type="submit">enviar</button>
   
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Informações de contacto</legend>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Informe o seu nome">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Informe o seu e-mail">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Informe a senha">

            <label for="data-nascimento">Data de nascimento</label>
            <input type="date" name="data_nascimento" id="data-nascimento" required>
        </fieldset>

        <fieldset>
            <legend>Preferências</legend>

            <p>Informe a sua cor favorita</p>
            <label><input type="radio" name="cor" value="azul"> Azul</label>
            <label><input type="radio" name="cor" value="vermelho"> Vermelho</label>

            <p>Informe a fruta que pretende</p>
            <label><input type="checkbox" name="fruta" value="maca"> Maçã</label>
            <label><input type="checkbox" name="fruta" value="uva"> Uva</label>

            <br><br>

            <label for="idioma">Idioma</label>
            <select name="idioma" id="idioma">
                <option value="" disabled selected>Selecione uma opção</option>
                <option value="pt">Português</option>
                <option value="en">Inglês</option>
            </select>

            <br><br>

            <label for="sugestoes">Sugestões</label>
            <textarea name="sugestoes" id="sugestoes"></textarea>
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
